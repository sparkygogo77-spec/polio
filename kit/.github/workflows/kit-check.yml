# Runs the builder contract check and the kit's own tests on every push and pull request, and on a
# pull request also kit:diff against the branch it merges into: a code change may not drop a hook
# the design uses; a branch named style/... (the builder's design coming back) may change only the
# style layer and token values. See PIPELINE.md.
# Active once this kit/ folder is a repo of its own (or copied to a repo root). Inside a bigger
# repo, copy this file to that repo's .github/workflows/ and set working-directory to the folder
# that holds builder.json.
name: kit-check
on:
  push:
  pull_request:
jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run kit:check
      - run: npm test
      - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'style/')
        run: npm run kit:diff -- --base origin/${{ github.base_ref }}
      - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'style/')
        run: npm run kit:diff -- --base origin/${{ github.base_ref }} --style-only
