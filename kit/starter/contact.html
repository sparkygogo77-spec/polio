<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Starter</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="style-layer.css">
<script type="module" src="js/contact.js"></script>
</head>
<body data-hook="page-contact">
<header data-hook="site-header">
  <a data-hook="site-logo" href="index.html">Starter</a>
  <nav data-hook="site-nav" aria-label="Main">
    <a data-hook="nav-home" href="index.html">Home</a>
    <a data-hook="nav-about" href="about.html">About</a>
    <a data-hook="nav-list" href="list.html">List</a>
    <a data-hook="nav-contact" href="contact.html">Contact</a>
  </nav>
</header>
<main data-hook="page-main" data-region="main" data-label="Main area">
  <h1 data-hook="page-title">Contact</h1>
  <p data-hook="page-intro">Send a short note.</p>
  <form data-hook="contact-form" data-label="Contact form" data-panel="contact-form" data-states="off on" data-state="on" novalidate>
    <label data-hook="name-field" data-group="form-field">
      <span data-hook="name-label">Name</span>
      <input data-hook="name-input" name="name" autocomplete="name">
      <span data-hook="name-error" data-label="Name problem" data-panel="name-error" data-states="off on" data-state="off">Please give a name.</span>
    </label>
    <label data-hook="email-field" data-group="form-field">
      <span data-hook="email-label">Email</span>
      <input data-hook="email-input" name="email" type="email" autocomplete="email">
      <span data-hook="email-error" data-label="Email problem" data-panel="email-error" data-states="off on" data-state="off">Please give a working email address.</span>
    </label>
    <label data-hook="message-field" data-group="form-field">
      <span data-hook="message-label">Message</span>
      <textarea data-hook="message-input" name="message" rows="4"></textarea>
    </label>
    <button data-hook="send-button" type="submit">Send</button>
  </form>
  <p data-hook="form-sent" data-label="Sent note" data-panel="form-sent" data-states="off on" data-state="off">Thanks, your note is on its way.</p>
</main>
<footer data-hook="site-footer">
  <p data-hook="footer-line">© <span data-hook="footer-year" data-kind="date">2026</span> Starter. Built to the builder contract.</p>
</footer>
</body>
</html>
