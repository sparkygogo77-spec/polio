<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360">
  <!--
    The veining: light caught in cracks, for a green construct.

    Turbulence stretched hard along one axis so the structures come out
    filament-shaped rather than blobby, then cut with a *discrete* alpha step
    rather than a ramp: only the top tenth of the noise survives at all, and
    it survives at full strength. A ramp left half of every tile painted and
    turned the whole face the vein colour, which is the surface inside out.

    It tiles seamlessly (`stitchTiles`) at a size big enough that nothing
    reads as a stamped pattern. There is one of these per temperature because
    a file cannot read a CSS custom property; the colour here is the family's
    own vein stop.
  -->
  <filter id="v" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.05" numOctaves="5" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.184  0 0 0 0 0.886  0 0 0 0 0.235  0 0 1 0 0"/>
    <feComponentTransfer><feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 0 0.55 1"/></feComponentTransfer>
  </filter>
  <rect width="520" height="360" filter="url(#v)" opacity="0.62"/>
</svg>
